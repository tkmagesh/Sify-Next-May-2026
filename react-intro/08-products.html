<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <script src="react.development.js"></script>
    <script src="react-dom.development.js"></script>
    <script src="babel.min.js"></script>
    <script type="text/babel">
        const Products = () => {
            const productNames = ['Pen', 'Pencil', 'Marker']
            /*
            const productItems = [
                <li key="0">Pen</li>,
                <li key="1">Pencil</li>,
                <li key="2">Marker</li>,
                <li key="3">Scribble Pad</li>
            ]
            */
            /*
            const productItems = []
            for (let idx = 0; idx < productNames.length; idx++){
                const productName = productNames[idx]
                const productItem = <li key={idx}>{productName}</li>
                productItems.push(productItem)
            }
            */
            const productItems = productNames.map((idx, productName) => <li key={idx}>{productName}</li>)
            return (
                <div>
                    <h1>Products</h1>
                    <ul>
                        {productItems}
                    </ul>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Products/>)
    </script>
</head>
<body>
    <div id="root">
        
    </div>
</body>
</html>
