        function Counter(){
            console.log('Counter Rendered')

            let [value, setValue] = React.useState(100)
            
            let onButtonClick = (e) => {
                switch (e.target.innerText) {
                    case 'Increment':
                        setValue(value + 1)
                        break;
                    case 'Decrement':
                        setValue(value - 1)
                        break;
                }
            };

            
            return (
                <div>
                    <h1>Counter</h1>
                    <div>
                        <button onClick={onButtonClick}>Decrement</button>
                        <span>[ {value} ]</span>
                        <button onClick={onButtonClick}>Increment</button>
                    </div>
                </div>
            )
        }

        function EvenGenerator(){
            let [evenList, setEvenList] = React.useState([])
            const onBtnGenerateNextClick = (e) => {
                console.log(e)
                setEvenList([...evenList, evenList.length * 2])
            }
            return (
                <div>
                    <h1>Even List</h1>
                    <div>{evenList.toString()}</div>
                    <button onClick={onBtnGenerateNextClick}>Generate Next</button>
                </div>
            )
        }

        function SimpleCounter(){
            console.log('Counter Rendered')

            let [value, setValue] = React.useState(0)
            
            let onButtonClick = (e) => {
                let newVal = value + 1
                setValue(newVal)
                console.log('value = ', newVal)
            };

            return (
                <div>
                    <h1>Counter</h1>
                    <div>
                        <span>[ {value} ]</span>
                        <button onClick={onButtonClick}>Increment</button>
                    </div>
                </div>
            )
        }

        

        function App(){
            return (
                <div>
                    {/* <Counter/>
                    <EvenGenerator/>
                    */}
                    <SimpleCounter/>
                </div>
            )
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <App/>
        );
    </script>
