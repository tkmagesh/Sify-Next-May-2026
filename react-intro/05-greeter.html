        function Greeter(props){
            console.log('Greeter rendered')
            
            const [message, setMessage] = React.useState('');
            const txtUserNameRef = React.useRef();
            

            const onBtnGreetClick = () => {
                let userName = txtUserNameRef.current.value;
                setMessage('Hi ' + userName + ', ' + props.msgTemplate)
            }
            return (
                <div>
                    <h1>Greeter</h1>
                    <hr/>
                    <label htmlFor="">User Name :</label>
                    <input type="text" ref={txtUserNameRef}/>
                    <button onClick={onBtnGreetClick}>Greet</button>
                    <div className="highlight">{message}</div>
                </div>
            )
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <div>
                <Greeter msgTemplate="Have a nice day!"/>
                <Greeter msgTemplate="Have a good day!"/>
            </div>
            )
    </script>
